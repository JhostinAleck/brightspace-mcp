<div class="p-6 space-y-5" x-data="configPage()" x-init="init()">
  <div class="flex justify-end gap-2">
    <button @click="showYaml=!showYaml" data-tooltip="Alterna entre el formulario visual y el editor YAML directo para power users."
            class="text-xs font-medium px-3 py-1.5 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-gray-600 dark:text-gray-300 hover:border-indigo-400 transition-colors"
            x-text="showYaml?'📝 Formulario':'📄 Ver YAML raw'"></button>
    <button @click="save()" :disabled="saving" class="text-xs font-medium px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg disabled:opacity-50 transition-colors" x-text="saving?'Guardando...':'💾 Guardar'"></button>
  </div>
  <div x-show="saveMsg" class="text-xs px-3 py-2 rounded-lg" :class="saveErr?'bg-red-100 dark:bg-red-900/20 text-red-600':'bg-emerald-100 dark:bg-emerald-900/20 text-emerald-700'" x-text="saveMsg"></div>

  <div x-show="showYaml" class="bg-white dark:bg-gray-900 rounded-xl border border-gray-100 dark:border-gray-800 shadow-sm overflow-hidden">
    <div class="px-5 py-3 border-b border-gray-100 dark:border-gray-800 flex items-center gap-2">
      <span class="text-xs font-semibold text-gray-400">config.yaml</span>
      <span class="text-xs bg-yellow-100 dark:bg-yellow-900/30 text-yellow-600 dark:text-yellow-400 px-2 py-0.5 rounded font-medium">edición directa</span>
    </div>
    <textarea x-model="yaml" rows="22" class="w-full p-4 bg-gray-950 text-green-400 font-mono text-xs focus:outline-none resize-none border-0"></textarea>
  </div>

  <div x-show="!showYaml" class="space-y-5">
    <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-100 dark:border-gray-800 shadow-sm p-5">
      <h2 class="text-sm font-semibold dark:text-white mb-4">Conexión</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1" data-tooltip="URL principal de Brightspace. Ej: https://bloqueneon.uniandes.edu.co">URL base <span class="text-gray-400">(?)</span></label>
          <input type="url" x-model="form.base_url" class="w-full text-sm bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg px-3 py-2 text-gray-800 dark:text-gray-200 focus:outline-none focus:border-indigo-400 transition-colors">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1" data-tooltip="Cómo el server se autentica con Brightspace.">Estrategia <span class="text-gray-400">(?)</span></label>
            <select x-model="form.strategy" class="w-full text-sm bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg px-3 py-2 text-gray-700 dark:text-gray-300">
              <option>browser</option><option>api_token</option><option>headless</option><option>session_cookie</option>
            </select>
          </div>
          <div x-show="form.strategy==='browser'">
            <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1" data-tooltip="Rellena automáticamente los selectores CSS para Azure AD / Office 365.">Preset SSO <span class="text-gray-400">(?)</span></label>
            <select x-model="form.preset" class="w-full text-sm bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg px-3 py-2 text-gray-700 dark:text-gray-300">
              <option>microsoft</option><option value="">none</option>
            </select>
          </div>
        </div>
      </div>
    </div>
    <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-100 dark:border-gray-800 shadow-sm p-5">
      <h2 class="text-sm font-semibold dark:text-white mb-4">Visualización</h2>
      <div class="grid grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1" data-tooltip="Zona horaria IANA para mostrar fechas. Ej: America/Bogota.">Zona horaria <span class="text-gray-400">(?)</span></label>
          <input type="text" x-model="form.tz" class="w-full text-sm bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-400 dark:text-gray-200 transition-colors">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1" data-tooltip="Idioma en que el MCP server muestra los resultados de los tools.">Idioma <span class="text-gray-400">(?)</span></label>
          <select x-model="form.locale" class="w-full text-sm bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg px-3 py-2 text-gray-700 dark:text-gray-300">
            <option value="es-419">Español (LATAM)</option>
            <option value="en-US">English (US)</option>
            <option value="pt-BR">Português (Brasil)</option>
            <option value="fr-CA">Français (Canada)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1" data-tooltip="Markdown: tablas y headers para Claude/Cursor. Plain: texto plano legacy.">Formato <span class="text-gray-400">(?)</span></label>
          <select x-model="form.format" class="w-full text-sm bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg px-3 py-2 text-gray-700 dark:text-gray-300">
            <option value="markdown">Markdown</option>
            <option value="plain">Texto plano</option>
          </select>
        </div>
      </div>
    </div>
    <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-100 dark:border-gray-800 shadow-sm p-5">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-sm font-semibold dark:text-white">Operaciones de escritura</h2>
          <p class="text-xs text-gray-400 mt-0.5" data-tooltip="Habilita submit_assignment, post_discussion_reply, mark_announcement_read.">Habilita tools que modifican datos en Brightspace</p>
        </div>
        <label class="toggle"><input type="checkbox" x-model="form.writes"><span class="toggle-slider"></span></label>
      </div>
    </div>
  </div>
</div>
<script>
function configPage(){return{yaml:'',showYaml:false,saving:false,saveMsg:null,saveErr:false,form:{base_url:'',strategy:'browser',preset:'microsoft',tz:'',locale:'es-419',format:'markdown',writes:false},async init(){const r=await fetch('/api/config');const d=await r.json();this.yaml=d.yaml||'';try{const m=this.yaml.match(/base_url:\s*(.+)/);if(m)this.form.base_url=m[1].trim();const t=this.yaml.match(/tz:\s*(.+)/);if(t)this.form.tz=t[1].trim();const l=this.yaml.match(/locale:\s*(.+)/);if(l)this.form.locale=l[1].trim();const f=this.yaml.match(/format:\s*(.+)/);if(f)this.form.format=f[1].trim()}catch{}},async save(){this.saving=true;this.saveMsg=null;const y=this.showYaml?this.yaml:this.yaml;try{const r=await fetch('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({yaml:y})});const d=await r.json();if(d.error){this.saveErr=true;this.saveMsg=d.error}else{this.saveErr=false;this.saveMsg='Guardado correctamente.'}}catch(e){this.saveErr=true;this.saveMsg=e.message}this.saving=false}}}
</script>
