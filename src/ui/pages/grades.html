<div class="p-6 space-y-3" x-data="gradesPage()" x-init="init()">
  <div x-show="loading" class="text-xs text-gray-400">Cargando...</div>
  <template x-for="course in courses" :key="course.courseId">
    <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-100 dark:border-gray-800 shadow-sm overflow-hidden">
      <button class="w-full px-5 py-4 flex items-center justify-between text-left hover:bg-gray-50 dark:hover:bg-gray-800/50 transition-colors" @click="course.open=!course.open">
        <h3 class="text-sm font-semibold dark:text-white" x-text="course.name"></h3>
        <div class="flex items-center gap-3">
          <div class="w-24 bg-gray-100 dark:bg-gray-800 rounded-full h-1.5"><div class="h-1.5 rounded-full" :class="course.avg>70?'bg-emerald-400':course.avg>50?'bg-yellow-400':'bg-red-400'" :style="`width:${course.avg}%`"></div></div>
          <span class="text-xs font-semibold dark:text-gray-300" x-text="`${course.avg.toFixed(1)}%`"></span>
          <span class="text-xs text-gray-400" x-text="course.open?'▲':'▼'"></span>
        </div>
      </button>
      <div x-show="course.open" class="divide-y divide-gray-50 dark:divide-gray-800">
        <template x-for="g in course.items" :key="g.itemName">
          <div class="px-5 py-2.5 flex items-center gap-3">
            <div class="flex-1 text-xs dark:text-gray-300" x-text="g.itemName"></div>
            <div class="text-xs text-gray-400 w-16 text-right" x-text="g.percent!==null?`${g.percent.toFixed(1)}%`:'sin calificar'" data-tooltip="Porcentaje calculado como (puntos obtenidos / puntos máximos) × 100."></div>
          </div>
        </template>
      </div>
    </div>
  </template>
</div>
<script>
function gradesPage(){return{courses:[],loading:true,async init(){this.loading=true;const r=await fetch('/api/grades');const d=await r.json();this.courses=(d.grades||[]).map(c=>{const items=c.items||[];const graded=items.filter(g=>g.percent!==null);const avg=graded.length?graded.reduce((s,g)=>s+g.percent,0)/graded.length:0;return{courseId:c.courseId,name:items[0]?.courseName||`Curso ${c.courseId}`,items,avg,open:false}});this.loading=false}}}
</script>
