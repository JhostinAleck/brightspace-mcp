<div class="p-6" x-data="annPage()" x-init="init()">
  <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-100 dark:border-gray-800 shadow-sm">
    <div class="px-5 py-4 border-b border-gray-100 dark:border-gray-800 flex items-center justify-between">
      <h2 class="text-sm font-semibold dark:text-white">Anuncios</h2>
      <span class="text-xs text-gray-400" x-text="`${items.length} total`"></span>
    </div>
    <div x-show="loading" class="px-5 py-4 text-xs text-gray-400">Cargando...</div>
    <template x-for="a in items" :key="a.id">
      <div class="px-5 py-4 border-b border-gray-100 dark:border-gray-800 last:border-0">
        <div class="text-sm font-medium dark:text-gray-200" x-text="a.title"></div>
        <div class="text-xs text-gray-400 mt-0.5" x-text="`${a.authorName||'Sin autor'} · ${new Date(a.postedAt).toLocaleDateString('es-419')}`"></div>
        <div class="text-xs text-gray-500 dark:text-gray-400 mt-1.5 leading-relaxed" x-text="(a.html||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,200)"></div>
      </div>
    </template>
    <div x-show="!loading&&items.length===0" class="px-5 py-4 text-xs text-gray-400">Sin anuncios recientes.</div>
  </div>
</div>
<script>
function annPage(){return{items:[],loading:true,async init(){this.loading=true;const r=await fetch('/api/announcements');const d=await r.json();this.items=(d.announcements||[]).flatMap(c=>c.items||[]).sort((a,b)=>new Date(b.postedAt)-new Date(a.postedAt));this.loading=false}}}
</script>
