<div class="p-6 space-y-4" x-data="authPage()" x-init="init()">
  <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-100 dark:border-gray-800 shadow-sm p-6">
    <div class="flex items-center gap-4 mb-4">
      <div class="w-12 h-12 rounded-full flex items-center justify-center text-2xl" :class="valid?'bg-emerald-100 dark:bg-emerald-900/30':'bg-red-100 dark:bg-red-900/30'">
        <span x-text="valid?'🔐':'🔓'"></span>
      </div>
      <div class="flex-1">
        <h2 class="text-base font-semibold dark:text-white" x-text="valid?'Sesión activa':'Sesión expirada'"></h2>
        <p class="text-xs text-gray-400 mt-0.5" x-text="info"></p>
      </div>
      <button @click="reauth()" :disabled="loading" data-tooltip="Fuerza una nueva autenticación con Brightspace sin cerrar sesión del MCP."
              class="text-xs font-medium px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg disabled:opacity-50 transition-colors"
              x-text="loading?'Autenticando...':'🔄 Re-autenticar'"></button>
    </div>
    <div x-show="err" class="text-xs text-red-400 bg-red-50 dark:bg-red-900/20 p-3 rounded-lg mt-2" x-text="err"></div>
    <div x-show="msg" class="text-xs text-emerald-600 bg-emerald-50 dark:bg-emerald-900/20 p-3 rounded-lg mt-2" x-text="msg"></div>
  </div>
  <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-100 dark:border-gray-800 shadow-sm p-5">
    <h3 class="text-sm font-semibold dark:text-white mb-3">Información de sesión</h3>
    <div class="grid grid-cols-2 gap-3 text-xs">
      <div><span class="text-gray-400">Zona horaria</span><div class="mt-1 font-medium dark:text-gray-200" x-text="tz||'—'"></div></div>
      <div><span class="text-gray-400">Idioma</span><div class="mt-1 font-medium dark:text-gray-200" x-text="locale||'—'"></div></div>
      <div><span class="text-gray-400">Versión</span><div class="mt-1 font-mono font-medium dark:text-gray-200" x-text="version?`v${version}`:'—'"></div></div>
    </div>
  </div>
</div>
<script>
function authPage(){return{valid:false,info:'',loading:false,err:null,msg:null,tz:'',locale:'',version:'',async init(){const r=await fetch('/api/status');const d=await r.json();this.valid=d.auth?.valid??false;this.info=d.auth?.error||'';this.tz=d.tz||'';this.locale=d.locale||'';this.version=d.version||''},async reauth(){this.loading=true;this.err=null;this.msg=null;try{const r=await fetch('/api/auth/refresh',{method:'POST'});const d=await r.json();if(d.ok){this.msg='Re-autenticación exitosa';await this.init()}else this.err=d.error||'Error desconocido'}catch(e){this.err=e.message}finally{this.loading=false}}}}
</script>
