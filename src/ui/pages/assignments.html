<div class="p-6" x-data="assignmentsPage()" x-init="init()">
  <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-100 dark:border-gray-800 shadow-sm overflow-hidden">
    <div class="px-5 py-4 border-b border-gray-100 dark:border-gray-800 flex items-center gap-3">
      <h2 class="text-sm font-semibold dark:text-white">Tareas</h2>
      <select x-model="filter" class="ml-auto text-xs bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg px-2 py-1.5 text-gray-600 dark:text-gray-300">
        <option value="pending">Sin entregar</option>
        <option value="submitted">Entregadas</option>
        <option value="all">Todas</option>
      </select>
    </div>
    <div x-show="loading" class="px-5 py-4 text-xs text-gray-400">Cargando...</div>
    <table class="w-full" x-show="!loading">
      <thead><tr class="border-b border-gray-100 dark:border-gray-800">
        <th class="text-left px-5 py-3 text-xs font-semibold text-gray-400">Tarea</th>
        <th class="text-left px-5 py-3 text-xs font-semibold text-gray-400" data-tooltip="Fecha límite convertida a tu zona horaria configurada.">Vence</th>
        <th class="text-left px-5 py-3 text-xs font-semibold text-gray-400">Estado</th>
      </tr></thead>
      <tbody>
        <template x-for="a in filtered" :key="a.id">
          <tr class="border-b border-gray-50 dark:border-gray-800 last:border-0">
            <td class="px-5 py-3 text-sm dark:text-gray-200" x-text="a.name"></td>
            <td class="px-5 py-3 text-xs text-gray-500" x-text="a.dueDateStr||'—'"></td>
            <td class="px-5 py-3"><span class="text-xs px-2 py-0.5 rounded-full font-medium" :class="a.hasSubmission?'bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400':'bg-orange-100 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400'" x-text="a.hasSubmission?'Entregada':'Sin entregar'"></span></td>
          </tr>
        </template>
        <tr x-show="filtered.length===0"><td colspan="3" class="px-5 py-4 text-xs text-gray-400">Sin tareas en esta vista.</td></tr>
      </tbody>
    </table>
  </div>
</div>
<script>
function assignmentsPage(){return{all:[],filter:'pending',loading:true,get filtered(){if(this.filter==='pending')return this.all.filter(a=>!a.hasSubmission);if(this.filter==='submitted')return this.all.filter(a=>a.hasSubmission);return this.all},async init(){this.loading=true;const r=await fetch('/api/assignments');const d=await r.json();this.all=(d.assignments||[]).flatMap(c=>(c.items||[]).map(a=>({...a,dueDateStr:a.dueDate?.iso||'—'})));this.loading=false}}}
</script>
